name = "kktc-mevzuat-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "kktc-mevzuat"
database_id = "315e78ee-3d0c-4736-8385-108e5c0d7358"

# Semantic search (Qwen3-Embedding on Workers AI + Vectorize). The index is
# created by .github/workflows/data.yml and filled by vectors.yml.
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORS"
index_name = "kktc-mevzuat-maddeler"

# Per-client limit (cf-connecting-ip): 30 requests a minute, enough for a
# person or an assistant, not for a bot draining the D1 quota. Approximate and
# per Cloudflare location. /health, /admin/* and requests carrying the admin
# token (our own GitHub jobs) are exempt; see apps/worker/src/index.ts.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Global circuit breaker: one Durable Object counts requests that reach D1,
# per minute, across the whole Worker (GATE_PER_MINUTE, default 50); above
# it the API answers 503 until the next minute. Bounds the bill against many
# clients at once, which the per-client limit above cannot. See src/gate.ts.
[[durable_objects.bindings]]
name = "GATE"
class_name = "TrafficGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrafficGate"]
