name: Refresh data

on:
  schedule:
    # Her pazartesi 03:00 UTC
    - cron: "0 3 * * 1"
    # Tek seferlik: D1 günlük okuma kotası sıfırlandıktan sonra.
    # 2026-11-04 00:15 UTC; çalıştıktan sonra bu satır kaldırılmalı.
    - cron: "15 0 4 11 *"
  workflow_dispatch:
    inputs:
      full_text:
        description: "Mahkemeler yasa PDF'lerini ve tüzüklerini de indir (uzun sürer)"
        type: boolean
        default: false

permissions:
  # write: history.db is kept as an asset of the "history" release
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      KKTC_CONTACT: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r crawler/requirements.txt

      - name: Restore text cache
        uses: actions/cache@v4
        with:
          path: data/text
          key: kktc-text-v3-${{ github.run_id }}
          restore-keys: |
            kktc-text-v3-

      # The last good catalogues stand in when a source site does not answer
      # (mevzuat.gov.ct.tr timed out on 2026-11-02); see cmd_crawl
      - name: Restore catalogue cache
        uses: actions/cache@v4
        with:
          path: data/catalog
          key: kktc-catalog-v1-${{ github.run_id }}
          restore-keys: |
            kktc-catalog-v1-

      - name: Crawl catalogues
        working-directory: crawler
        run: python -m kktc crawl

      - name: Download consolidated government texts
        working-directory: crawler
        run: python -m kktc fetch-text --source gov --revalidate

      # Most laws (Gelir Vergisi, KDV, Sosyal Sigortalar, ...) exist only on
      # mevzuat.mahkemeler.net, as consolidated Word files. Laws also on the
      # government site are skipped here (merged under the gov copy). Every
      # week each file is downloaded again and compared by SHA-256, as for gov.
      # ~800 files, ~200 MB; .doc needs LibreOffice.
      - name: Install LibreOffice for .doc files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui \
            || sudo apt-get install -y -qq --no-install-recommends libreoffice-writer
          soffice --version

      - name: Download mahkemeler law texts (Word)
        working-directory: crawler
        run: python -m kktc fetch-text --source mahkemeler --type yasa --ext doc,docx,rtf --revalidate

      # The PDFs are mostly large scans of old or English-language laws
      # (~7.6 MB each on average), so they are fetched on demand only.
      - name: Download mahkemeler law texts (PDF)
        if: ${{ inputs.full_text == true }}
        working-directory: crawler
        run: python -m kktc fetch-text --source mahkemeler --type yasa --ext pdf

      - name: Download mahkemeler regulation texts
        if: ${{ inputs.full_text == true }}
        working-directory: crawler
        run: python -m kktc fetch-text --source mahkemeler --type tuzuk --min-year 2015

      # Version history is the only state that must survive between runs. It
      # lives as an asset of the "history" release (not the cache, which can be
      # evicted). If the asset exists but cannot be downloaded the job stops,
      # so an empty history never overwrites the real one.
      - name: Restore version history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release view history --json assets --jq '.assets[].name' 2>/dev/null | grep -qx history.db; then
            gh release download history --pattern history.db --dir data --clobber
            cp data/history.db data/history-prev.db
            echo "history.db restored ($(du -h data/history.db | cut -f1))"
          else
            echo "::notice::history.db bulunamadı; bu çalıştırma sürüm takibinin başlangıcı (baseline) olacak."
          fi

      - name: Build SQLite + D1 export
        working-directory: crawler
        run: python -m kktc build

      - name: Save version history
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view history >/dev/null 2>&1; then
            gh release create history --title "Sürüm geçmişi (history.db)" --latest=false \
              --notes "Mevzuat sürüm geçmişi. Veri yenileme iş akışı her çalıştırmada history.db dosyasını günceller; history-prev.db bir önceki kopyadır. Elle silmeyin."
          fi
          files=(data/history.db)
          [[ -f data/history-prev.db ]] && files+=(data/history-prev.db)
          gh release upload history "${files[@]}" --clobber

      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm ci

      - name: Point Wrangler at the D1 database
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("apps/worker/wrangler.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'database_id\s*=\s*"[^"]*"', f'database_id = "{os.environ["D1_ID"]}"', text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Import schema and data into D1
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute kktc-mevzuat --remote --yes --file=dist/d1/001-schema.sql
          npx wrangler d1 execute kktc-mevzuat --remote --yes --file=dist/d1/002-reset.sql
          while IFS= read -r file; do
            [[ -z "$file" || "$file" == \#* ]] && continue
            [[ "$file" == "001-schema.sql" || "$file" == "002-reset.sql" ]] && continue
            echo "::group::Import $file"
            npx wrangler d1 execute kktc-mevzuat --remote --yes --file="dist/d1/$file"
            echo "::endgroup::"
          done < <(grep -vE '^\s*(#|$)' dist/d1/import-order.txt)

      - name: Verify D1 counts
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 execute kktc-mevzuat --remote --command "SELECT type, COUNT(*) AS n FROM documents GROUP BY type ORDER BY n DESC"

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm --workspace apps/worker run deploy

      - name: Smoke test live API
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          BASE: ${{ vars.WORKER_URL || 'https://kktc-mevzuat-api.stevevaius.workers.dev' }}
        run: |
          sleep 5
          node scripts/smoke.mjs

      - name: Evaluate search quality
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          BASE: ${{ vars.WORKER_URL || 'https://kktc-mevzuat-api.stevevaius.workers.dev' }}
        run: node scripts/eval-search.mjs

      - name: Warn when Cloudflare secrets are missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN yok; veri üretildi ancak D1/Worker dağıtımı atlandı."
