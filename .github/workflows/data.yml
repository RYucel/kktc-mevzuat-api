name: Refresh data

on:
  schedule:
    # Her pazartesi 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full_text:
        description: "Mahkemeler yasa PDF'lerini ve tüzüklerini de indir (uzun sürer)"
        type: boolean
        default: false
      full_import:
        description: "D1'i sıfırdan yükle (normalde yalnız değişen belgeler yazılır)"
        type: boolean
        default: false

permissions:
  # write: history.db is kept as an asset of the "history" release
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      KKTC_CONTACT: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r crawler/requirements.txt

      - name: Restore text cache
        uses: actions/cache@v4
        with:
          path: data/text
          key: kktc-text-v3-${{ github.run_id }}
          restore-keys: |
            kktc-text-v3-

      # The last good catalogues stand in when a source site does not answer
      # (mevzuat.gov.ct.tr timed out on 2026-11-02); see cmd_crawl
      - name: Restore catalogue cache
        uses: actions/cache@v4
        with:
          path: data/catalog
          key: kktc-catalog-v1-${{ github.run_id }}
          restore-keys: |
            kktc-catalog-v1-

      - name: Crawl catalogues
        working-directory: crawler
        run: python -m kktc crawl

      - name: Download consolidated government texts
        working-directory: crawler
        run: python -m kktc fetch-text --source gov --revalidate

      # Most laws (Gelir Vergisi, KDV, Sosyal Sigortalar, ...) exist only on
      # mevzuat.mahkemeler.net, as consolidated Word files. Laws also on the
      # government site are skipped here (merged under the gov copy). Every
      # week each file is downloaded again and compared by SHA-256, as for gov.
      # ~800 files, ~200 MB; .doc needs LibreOffice.
      - name: Install LibreOffice for .doc files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui \
            || sudo apt-get install -y -qq --no-install-recommends libreoffice-writer
          soffice --version

      - name: Download mahkemeler law texts (Word)
        working-directory: crawler
        run: python -m kktc fetch-text --source mahkemeler --type yasa --ext doc,docx,rtf --revalidate

      # The PDFs are mostly large scans of old or English-language laws
      # (~7.6 MB each on average), so they are fetched on demand only.
      - name: Download mahkemeler law texts (PDF)
        if: ${{ inputs.full_text == true }}
        working-directory: crawler
        run: python -m kktc fetch-text --source mahkemeler --type yasa --ext pdf --retry-errors

      - name: Download mahkemeler regulation texts
        if: ${{ inputs.full_text == true }}
        working-directory: crawler
        run: python -m kktc fetch-text --source mahkemeler --type tuzuk --min-year 2015 --retry-errors

      # Version history is the only state that must survive between runs. It
      # lives as an asset of the "history" release (not the cache, which can be
      # evicted). If the asset exists but cannot be downloaded the job stops,
      # so an empty history never overwrites the real one.
      - name: Restore version history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release view history --json assets --jq '.assets[].name' 2>/dev/null | grep -qx history.db; then
            gh release download history --pattern history.db --dir data --clobber
            cp data/history.db data/history-prev.db
            echo "history.db restored ($(du -h data/history.db | cut -f1))"
          else
            echo "::notice::history.db bulunamadı; bu çalıştırma sürüm takibinin başlangıcı (baseline) olacak."
          fi
          # What is in D1 now (written after the last successful import). With
          # it the export sends only changed documents; without it, everything.
          if [[ "${{ inputs.full_import }}" != "true" ]] && \
             gh release view history --json assets --jq '.assets[].name' 2>/dev/null | grep -qx d1-state.json; then
            gh release download history --pattern d1-state.json --dir data --clobber
          fi

      - name: Build SQLite + D1 export
        working-directory: crawler
        run: |
          state=../data/d1-state.json
          if [[ -f "$state" ]]; then
            python -m kktc build --d1-state "$state"
          else
            python -m kktc build
          fi
          echo "### D1 dışa aktarımı" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat ../dist/d1/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Citations depend on the article split; this shows its health per run.
      - name: Article structure report
        continue-on-error: true
        run: python scripts/article_report.py data/kktc.db

      # Article units for the semantic index (see vectors.yml). Exported from
      # the fresh database so chunk ordinals match D1.
      - name: Export vector units
        working-directory: crawler
        run: |
          python -m kktc vectors export
          # Trial index (OPUS-GOREVLER-5 item 5): units with document context, 128 dimensions.
          python -m kktc vectors export --format 2 --dims 128 --units ../data/vector-units-next.jsonl.gz

      - name: Save version history
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view history >/dev/null 2>&1; then
            gh release create history --title "Sürüm geçmişi (history.db)" --latest=false \
              --notes "Mevzuat sürüm geçmişi. Veri yenileme iş akışı her çalıştırmada history.db dosyasını günceller; history-prev.db bir önceki kopyadır. Elle silmeyin."
          fi
          files=(data/history.db data/vector-units.jsonl.gz)
          [[ -f data/vector-units-next.jsonl.gz ]] && files+=(data/vector-units-next.jsonl.gz)
          [[ -f data/history-prev.db ]] && files+=(data/history-prev.db)
          gh release upload history "${files[@]}" --clobber

      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm ci

      - name: Point Wrangler at the D1 database
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("apps/worker/wrangler.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'database_id\s*=\s*"[^"]*"', f'database_id = "{os.environ["D1_ID"]}"', text)
          path.write_text(text, encoding="utf-8")
          PY

      # Diagnosis (2026-11-09): which columns make the incremental export
      # rewrite unchanged documents? Compares this build with D1 before the
      # import. Read-only; never fails the run.
      - name: Compare build with D1 (diagnosis)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute kktc-mevzuat --remote --json --command "SELECT * FROM documents" > /tmp/d1-docs.json
          npx wrangler d1 execute kktc-mevzuat --remote --json --command "SELECT doc_id, COUNT(*) AS n, SUM(LENGTH(text)) AS chars, SUM(id % 1000003) AS idsum FROM chunks GROUP BY doc_id" > /tmp/d1-chunks.json
          python scripts/d1_diff.py data/kktc.db /tmp/d1-docs.json /tmp/d1-chunks.json | tee /tmp/d1-diff.txt
          { echo "### Derleme ile D1 farkı"; echo '```'; head -60 /tmp/d1-diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Import schema and data into D1
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # A full import starts with a reset. Drop the saved state first, so
          # that if this import stops halfway the next run is a full one again
          # instead of an incremental one on top of a half-empty D1.
          if [[ -f dist/d1/002-reset.sql ]]; then
            gh release delete-asset history d1-state.json --yes 2>/dev/null || true
          fi
          while IFS= read -r file; do
            [[ -z "$file" || "$file" == \#* ]] && continue
            echo "::group::Import $file"
            npx wrangler d1 execute kktc-mevzuat --remote --yes --file="dist/d1/$file"
            echo "::endgroup::"
          done < <(grep -vE '^\s*(#|$)' dist/d1/import-order.txt)
          # D1 now matches this build: the next export diffs against it.
          gh release upload history dist/d1/d1-state.json --clobber

      # Merge the FTS index segments left by the bulk insert. Unmerged, every
      # MATCH walks many segments and D1 answered "overloaded" on 9 Nov 2026.
      - name: Optimize FTS index
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: npx wrangler d1 execute kktc-mevzuat --remote --yes --command "INSERT INTO chunks_fts(chunks_fts) VALUES('optimize')"

      # Informational only. It reads D1, so on a day the free-tier read quota is
      # already used up it fails; that must not stop the Worker deploy and the
      # vector index steps below (2026-11-03).
      - name: Verify D1 counts
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: npx wrangler d1 execute kktc-mevzuat --remote --command "SELECT type, COUNT(*) AS n FROM documents GROUP BY type ORDER BY n DESC"

      # The Worker binds a Vectorize index for semantic search. Create it on
      # the first run; if the API token cannot (no "Vectorize: Edit"
      # permission), deploy without the binding so lexical search keeps
      # working.
      - name: Ensure vector index
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -uo pipefail
          INDEX=kktc-mevzuat-maddeler
          if npx wrangler vectorize get "$INDEX" >/dev/null 2>&1; then
            echo "Vectorize index $INDEX exists."
            # Type filters need this metadata index; it may be missing if an
            # earlier run created the index but stopped halfway.
            npx wrangler vectorize create-metadata-index "$INDEX" --propertyName=type --type=string >/dev/null 2>&1 || true
          elif npx wrangler vectorize create "$INDEX" --dimensions=192 --metric=cosine \
               && npx wrangler vectorize create-metadata-index "$INDEX" --propertyName=type --type=string; then
            echo "Created Vectorize index $INDEX."
          else
            echo "::warning::Vectorize dizini oluşturulamadı (API token'a 'Vectorize: Edit' izni gerekir). Worker anlamsal arama olmadan dağıtılıyor."
            python - <<'PY'
          import pathlib, re
          path = pathlib.Path("apps/worker/wrangler.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"\n\[\[vectorize\]\][^\[]*", "\n", text)
          path.write_text(text, encoding="utf-8")
          PY
          fi

      - name: Ensure trial vector index
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: scripts/ensure-vector-index.sh kktc-mevzuat-maddeler-128 128 VECTORS_NEXT

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm --workspace apps/worker run deploy

      # Token for /admin/vectors/*: derived from the Cloudflare API token, so
      # there is no extra secret to manage (vectors.yml derives the same).
      - name: Set vector admin token
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ADMIN=$(cd crawler && python -m kktc vectors admin-token)
          echo "::add-mask::$ADMIN"
          printf '%s' "$ADMIN" | npx wrangler secret put VECTOR_ADMIN_TOKEN --config apps/worker/wrangler.toml
          # Smoke test and search eval below send it: exempt from the rate limit.
          echo "ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"

      - name: Smoke test live API
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          BASE: ${{ vars.WORKER_URL || 'https://kktc-mevzuat-api.stevevaius.workers.dev' }}
        run: |
          sleep 5
          node scripts/smoke.mjs

      - name: Evaluate search quality
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          BASE: ${{ vars.WORKER_URL || 'https://kktc-mevzuat-api.stevevaius.workers.dev' }}
        run: node scripts/eval-search.mjs

      - name: Warn when Cloudflare secrets are missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN yok; veri üretildi ancak D1/Worker dağıtımı atlandı."
