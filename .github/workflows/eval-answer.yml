name: Measure answers

# End-to-end quality of /v1/answer on the live Worker: compares query-string
# variants (rerank off, passages per document 1-3) on the same questions.
# Each reranked question is one Clef call on the Workers AI daily allocation.

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Karşılaştırılacak varyantlar (virgülle)"
        default: "focus2=0,passages=3"
      sets:
        description: "Soru setleri: questions, keywords"
        default: "questions"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ vars.WORKER_URL || 'https://kktc-mevzuat-api.stevevaius.workers.dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Exempts this job from the Worker's per-client rate limit.
      - name: Derive admin token
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          ADMIN=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['CLOUDFLARE_API_TOKEN']+':kktc-vectors').encode()).hexdigest())")
          echo "::add-mask::$ADMIN"
          echo "ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure
        env:
          VARIANTS: ${{ inputs.variants }}
          SETS: ${{ inputs.sets }}
        run: node scripts/eval-answer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-answer
          path: eval-answer.json
          if-no-files-found: ignore
