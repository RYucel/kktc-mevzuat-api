name: D1 maintenance

# One-off maintenance on the live D1 database without a data refresh.
#   optimize: merge FTS5 index segments (after a bulk import)
#   info:      database size and table count (free tier limit: 500 MB)
#   inventory: every Worker, Pages project, D1, KV, R2 and Vectorize index
#              in the account with 30-day usage (scripts/cf-inventory.py).
#              The repository is public: the report lists resource names
#              and usage counts only (no ids, no secrets).

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Görev"
        type: choice
        options: [optimize, info, inventory]
        default: optimize

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Point Wrangler at the D1 database
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("apps/worker/wrangler.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'database_id\s*=\s*"[^"]*"', f'database_id = "{os.environ["D1_ID"]}"', text)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Optimize FTS index
        if: ${{ inputs.task == 'optimize' }}
        working-directory: apps/worker
        run: npx wrangler d1 execute kktc-mevzuat --remote --yes --command "INSERT INTO chunks_fts(chunks_fts) VALUES('optimize')"
      - name: Database info
        if: ${{ inputs.task == 'info' }}
        working-directory: apps/worker
        run: |
          npx wrangler d1 info kktc-mevzuat
          npx wrangler d1 execute kktc-mevzuat --remote --command "SELECT (SELECT COUNT(*) FROM documents) AS documents, (SELECT COUNT(*) FROM chunks) AS chunks, (SELECT COUNT(*) FROM doc_versions) AS versions, (SELECT COUNT(*) FROM changes) AS changes"
      - name: Account inventory
        if: ${{ inputs.task == 'inventory' }}
        run: python3 scripts/cf-inventory.py
