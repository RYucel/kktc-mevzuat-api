name: D1 maintenance

# One-off maintenance on the live D1 database without a data refresh.
#   optimize: merge FTS5 index segments (after a bulk import)
#   info:      database size and table count (free tier limit: 500 MB)
#   inventory: every Worker, Pages project, D1, KV, R2 and Vectorize index
#              in the account with 30-day usage (scripts/cf-inventory.py).
#              The repository is public: the report lists resource names
#              and usage counts only (no ids, no secrets).
#   texts:     text status of every statute (JSON lines in the log).
#   articles:  the expected articles of the eval questions (statute text
#              only) and ids stored with leading zeros (scripts/eval-articles.py).
#   regulation-heads: the opening text of every regulation (where it names
#              its parent law; OPUS-GOREVLER-4 item 8).
#   usage:     daily counters (answers by confidence, caps, Clef neurons) and
#              verdicts per document for the last 14 days; numbers only.
#   toc:       article headings and opening text of the given statutes
#              (input ids), for the term dictionary.
#   rewrites:  the cached LLM rewrites of the eval questions only. The cache
#              also holds real users' questions; the log is public, so those
#              are never printed.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Görev"
        type: choice
        options: [optimize, info, inventory, texts, rewrites, articles, regulation-heads, usage, sample-articles, toc]
        default: optimize
      ids:
        description: "toc: belge kimlikleri (virgülle)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Point Wrangler at the D1 database
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("apps/worker/wrangler.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'database_id\s*=\s*"[^"]*"', f'database_id = "{os.environ["D1_ID"]}"', text)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Optimize FTS index
        if: ${{ inputs.task == 'optimize' }}
        working-directory: apps/worker
        run: npx wrangler d1 execute kktc-mevzuat --remote --yes --command "INSERT INTO chunks_fts(chunks_fts) VALUES('optimize')"
      - name: Database info
        if: ${{ inputs.task == 'info' }}
        working-directory: apps/worker
        run: |
          npx wrangler d1 info kktc-mevzuat
          npx wrangler d1 execute kktc-mevzuat --remote --command "SELECT (SELECT COUNT(*) FROM documents) AS documents, (SELECT COUNT(*) FROM chunks) AS chunks, (SELECT COUNT(*) FROM doc_versions) AS versions, (SELECT COUNT(*) FROM changes) AS changes"
      - name: Account inventory
        if: ${{ inputs.task == 'inventory' }}
        run: python3 scripts/cf-inventory.py
      - name: Statute text report
        if: ${{ inputs.task == 'texts' }}
        working-directory: apps/worker
        run: |
          npx wrangler d1 execute kktc-mevzuat --remote --json --command "SELECT id, type, title, source, text_status, content_chars, chunk_count, pdf_url, sources_json FROM documents WHERE type != 'karar' ORDER BY id" > /tmp/texts.json
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/texts.json"))[0]["results"]
          print("TEXTS-JSON-BEGIN")
          for r in rows:
              print(json.dumps(r, ensure_ascii=False))
          print("TEXTS-JSON-END")
          PY
      - name: Rewrites of the eval questions
        if: ${{ inputs.task == 'rewrites' }}
        working-directory: apps/worker
        run: |
          npx wrangler d1 execute kktc-mevzuat --remote --json --command "SELECT model, q, terms, laws, created_at FROM rewrite_cache" > /tmp/rewrites.json
          python3 - <<'PY'
          import json, re
          # Same key as rewriteCacheKey() in apps/worker/src/index.ts.
          def key(q):
              q = q.replace("I", "ı").replace("İ", "i").lower()
              q = re.sub(r"\s+", " ", q).strip()
              return re.sub(r"[\s?.!,;:]+$", "", q)[:500]
          wanted = {key(c["q"]) for c in json.load(open("../../scripts/eval-questions.json"))["cases"]}
          rows = json.load(open("/tmp/rewrites.json"))[0]["results"]
          print("REWRITES-JSON-BEGIN")
          for r in rows:
              if r["q"] in wanted:
                  print(json.dumps(r, ensure_ascii=False))
          print("REWRITES-JSON-END")
          print(f"{sum(r['q'] in wanted for r in rows)} eval rewrites printed; {len(rows)} cached in total")
          PY
      - name: Expected articles of the eval questions
        if: ${{ inputs.task == 'articles' }}
        run: python3 scripts/eval-articles.py scripts/eval-questions.json scripts/eval-holdout.json
      - name: Opening text of every regulation
        if: ${{ inputs.task == 'regulation-heads' }}
        working-directory: apps/worker
        run: |
          npx wrangler d1 execute kktc-mevzuat --remote --json --command "SELECT d.id, d.title, substr(c.text, 1, 400) AS head FROM documents d JOIN chunks c ON c.doc_id = d.id AND c.ord = (SELECT MIN(ord) FROM chunks WHERE doc_id = d.id AND kind != 'title') WHERE d.type = 'tuzuk' AND d.text_status != 'metadata' ORDER BY d.id" > /tmp/heads.json
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/heads.json"))[0]["results"]
          print("HEADS-JSON-BEGIN")
          for r in rows:
              print(json.dumps(r, ensure_ascii=False))
          print("HEADS-JSON-END")
          print(len(rows), "regulations")
          PY
      - name: Usage counters and verdicts
        if: ${{ inputs.task == 'usage' }}
        working-directory: apps/worker
        run: |
          npx wrangler d1 execute kktc-mevzuat --remote --command "SELECT day, key, n FROM usage_counters WHERE day >= date('now', '-14 days') ORDER BY day, key"
          npx wrangler d1 execute kktc-mevzuat --remote --command "SELECT document_id, ref, verdict, COUNT(*) AS n FROM feedback WHERE day >= date('now', '-14 days') GROUP BY document_id, ref, verdict ORDER BY n DESC LIMIT 100" || echo "no feedback table yet"
      - name: Sample articles for new eval questions
        if: ${{ inputs.task == 'sample-articles' }}
        run: python3 scripts/sample-articles.py scripts/eval-questions.json scripts/eval-holdout.json
      - name: Table of contents of given statutes
        if: ${{ inputs.task == 'toc' }}
        env:
          IDS: ${{ inputs.ids }}
        run: python3 scripts/statute-toc.py "$IDS"
